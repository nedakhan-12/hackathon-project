    <!-- ================================
         TRUSTED CONTACT SECTION
    ================================= -->

    <main>

        <section class="page-section">

            <h1>Trusted Contact</h1>

            <p>
                Add a trusted person who can be contacted
                during an emergency.
            </p>


            <div class="contact-card">

                <form id="contactForm">

                    <!-- Contact Name -->

                    <div class="form-group">

                        <label for="contactName">
                            Contact Name
                        </label>

                        <input
                            type="text"
                            id="contactName"
                            name="contactName"
                            placeholder="Enter contact name"
                            required
                        >

                    </div>


                    <!-- Phone Number -->

                    <div class="form-group">

                        <label for="contactPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="contactPhone"
                            name="contactPhone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <!-- Relationship -->

                    <div class="form-group">

                        <label for="relationship">
                            Relationship
                        </label>

                        <input
                            type="text"
                            id="relationship"
                            name="relationship"
                            placeholder="e.g. Mother, Sister, Friend"
                        >

                    </div>


                    <!-- Save Button -->

                    <button type="submit">
                        Save Trusted Contact
                    </button>

                </form>


                <!-- Success / Error Message -->

                <div id="contactMessage"></div>

            </div>

        </section>

    </main>

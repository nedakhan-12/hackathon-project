    <!-- ================================

    ================================= -->

    <main>

        <section class="page-section">

            <h1>Personal Safety Plan</h1>

            <p>
                Create a simple safety plan to help you stay
                prepared in an unsafe situation.
            </p>


            <div class="safety-card">

                <form id="safetyForm">

                    <!-- Safe Place -->

                    <div class="form-group">

                        <label for="safePlace">
                            My Safe Place
                        </label>

                        <input
                            type="text"
                            id="safePlace"
                            name="safePlace"
                            placeholder="Enter a safe place"
                            required
                        >

                    </div>


                    <!-- Emergency Person -->

                    <div class="form-group">

                        <label for="emergencyPerson">
                            Emergency Person
                        </label>

                        <input
                            type="text"
                            id="emergencyPerson"
                            name="emergencyPerson"
                            placeholder="Enter emergency contact"
                            required
                        >

                    </div>


                    <!-- Safety Notes -->

                    <div class="form-group">

                        <label for="planNotes">
                            Safety Notes
                        </label>

                        <textarea
                            id="planNotes"
                            name="planNotes"
                            rows="6"
                            placeholder="Write your safety plan..."
                        ></textarea>

                    </div>


                    <!-- Save Button -->

                    <button type="submit">
                        Save Safety Plan
                    </button>

                </form>


                <!-- Message -->

                <div id="safetyMessage"></div>

            </div>

        </section>

    </main>
